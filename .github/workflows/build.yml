name: Build APK

# Builds the app on GitHub's servers. Run it from the "Actions" tab: Build APK -> Run workflow.
# The finished file appears at the bottom of the run page, under "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Find the project folder (the one that contains settings.gradle)
        id: find
        run: |
          echo "--- files in the repository ---"
          ls -la
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found. Upload the CONTENTS of the sms-gateway-app folder to the repository root."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR" "$DIR/app" "$DIR/app/src/main" || true

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already contains the Android SDK ($ANDROID_HOME). Only make sure the licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
